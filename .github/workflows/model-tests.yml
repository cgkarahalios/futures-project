name: Model tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-model.txt
      - run: python -m unittest discover -s tests -p '*model.py' -v
      - run: python -m unittest discover -s tests -p 'test_timing_grid_search.py' -v
